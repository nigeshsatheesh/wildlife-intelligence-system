services:
  - type: web
    name: wildlife-intelligence-backend
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://main.d3g1h588jh5v8o.amplifyapp.com
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ML_IMAGE_SERVICE_URL
        sync: false
      - key: ML_AUDIO_SERVICE_URL
        sync: false
