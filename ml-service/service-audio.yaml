apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: wildlife-audio
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      containerConcurrency: 80
      containers:
        - image: IMAGE_URL
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
---
# Deploy from ml-service/ with:
# gcloud run deploy wildlife-audio --source . --dockerfile Dockerfile.audio --region REGION --platform managed --allow-unauthenticated --memory 4Gi --cpu 2 --min-instances=1 --max-instances=2 --port 8080
