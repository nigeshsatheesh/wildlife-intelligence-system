services:
  ml-image:
    build:
      context: ./ml-service
      dockerfile: Dockerfile.image
    environment:
      - PORT=5001
    ports:
      - "5001:5001"
    volumes:
      - tfhub-cache:/app/tfhub_cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ml-audio:
    build:
      context: ./ml-service
      dockerfile: Dockerfile.audio
    environment:
      - PORT=5002
    ports:
      - "5002:5002"
    volumes:
      - tfhub-cache:/app/tfhub_cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - ML_IMAGE_SERVICE_URL=http://ml-image:5001
      - ML_AUDIO_SERVICE_URL=http://ml-audio:5002
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - ml-image
      - ml-audio
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  tfhub-cache: